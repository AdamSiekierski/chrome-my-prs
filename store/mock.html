<!doctype html>
<!-- Renders the Chrome Web Store images from the real popup/options pages with a fake `chrome` API.
     Regenerate: bun run store:images. ?shot=popup | options | tile -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store images</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        color: #1f2328;
      }
      .stage {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        position: relative;
        background: linear-gradient(135deg, #f3e9fe 0%, #f6f7f9 55%, #e8f0fe 100%);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 300px;
        width: 470px;
      }
      h1 {
        font-size: 40px;
        line-height: 1.15;
        margin: 0 0 16px;
        letter-spacing: -0.5px;
      }
      .copy p {
        margin: 0;
        font-size: 19px;
        color: #4b535c;
      }
      iframe {
        border: 0;
        display: block;
        background: #fff;
      }
      .card {
        position: absolute;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.08),
          0 18px 48px rgba(60, 20, 110, 0.22);
      }

      /* Fake Chrome tab strip */
      .strip {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 84px;
        background: #dee1e6;
      }
      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 0;
        height: 46px;
        padding: 0 10px;
      }
      .gl {
        align-self: center;
        margin: 0 6px 0 4px;
        background: #a142f4;
        color: #fff;
        font: 600 13px system-ui;
        border-radius: 6px;
        padding: 3px 9px;
      }
      .tab {
        width: 190px;
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        font: 12.5px system-ui;
        color: #3c4043;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 3px solid #a142f4;
      }
      .tab.active {
        background: #fff;
        border-radius: 9px 9px 0 0;
      }
      .tab.other {
        border-bottom-color: transparent;
      }
      .fav {
        flex: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #1f2328;
      }
      .tab span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .omni {
        height: 38px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 10px;
      }
      .url {
        flex: 1;
        height: 28px;
        border-radius: 14px;
        background: #f1f3f4;
        font: 13px system-ui;
        color: #5f6368;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .ext {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e8dafd;
        display: grid;
        place-items: center;
      }
      .ext img {
        width: 16px;
        height: 16px;
      }

      .tile {
        width: 440px;
        height: 280px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 36px;
        background: linear-gradient(135deg, #a142f4, #6e2bc4);
        color: #fff;
      }
      .tile img {
        width: 64px;
        height: 64px;
        margin-bottom: 14px;
      }
      .tile h1 {
        font-size: 30px;
        margin: 0 0 6px;
      }
      .tile p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <script>
      // Fictional data: never screenshot real PRs.
      const ago = (min) => Date.now() - min * 60000;
      const pr = (repo, number, title, draft = false) => ({
        key: `${repo}#${number}`.toLowerCase(),
        url: `https://github.com/${repo}/pull/${number}`,
        number,
        title,
        repo,
        draft,
      });
      const PRS = [
        pr('acme/storefront', 482, 'Add Apple Pay to checkout'),
        pr('acme/storefront', 479, 'Fix cart badge count after logout'),
        pr('acme/storefront', 471, 'Migrate product grid to CSS subgrid', true),
        pr('acme/api', 1307, 'Rate-limit the search endpoint per token'),
        pr('acme/api', 1299, 'Bump Postgres driver to 3.4'),
        pr('acme/design-system', 88, 'Button: add loading state'),
        pr('octo/dotfiles', 12, 'zsh: lazy-load nvm'),
      ];
      const STATE = {
        local: {
          token: 'ghp_example',
          groupTitle: 'My PRs',
          groupColor: 'purple',
          enabled: true,
          extraQuery: 'org:acme',
          prCache: { prs: PRS, blockedOrgs: [], fetchedAt: ago(1), error: null },
        },
        sync: { hidden: { 'octo/dotfiles#12': ago(600) } },
      };

      // Injected into each iframe before the page's own module scripts run.
      const stub = `<script>
  const S = ${JSON.stringify(STATE)};
  // get(null | key | keys | { key: default }), like chrome.storage
  const area = (a) => ({ get: async (k) => {
    const defaults = k && typeof k === 'object' && !Array.isArray(k) ? k : {};
    const keys = k == null ? Object.keys(S[a]) : [].concat(k === defaults ? Object.keys(k) : k);
    return { ...defaults, ...Object.fromEntries(keys.filter((x) => x in S[a]).map((x) => [x, S[a][x]])) };
  }, set: async () => {} });
  window.chrome = {
    storage: { local: area('local'), sync: area('sync'), onChanged: { addListener() {} } },
    runtime: { sendMessage: async () => {}, openOptionsPage() {} },
    tabs: { create() {} },
  };
<\/script>`;

      async function frame(page, w, h, prep) {
        const html = await (await fetch(`/${page}`)).text();
        const f = document.createElement('iframe');
        f.width = w;
        f.height = h;
        f.srcdoc = html.replace('<head>', `<head>${stub}`);
        if (prep) f.onload = () => setTimeout(() => prep(f.contentDocument), 50);
        return f;
      }

      const shot = new URLSearchParams(location.search).get('shot') ?? 'popup';
      const stage = document.createElement('div');
      document.body.append(stage);

      if (shot === 'popup') {
        stage.className = 'stage';
        const tabs = [
          ['other', 'Inbox'],
          ['active', 'Add Apple Pay to checkout · acme/storefront'],
          ['', 'Fix cart badge count after logout'],
          ['', 'Migrate product grid to CSS subgrid'],
          ['', 'Rate-limit the search endpoint per token'],
          ['', 'Bump Postgres driver to 3.4'],
        ];
        stage.innerHTML = `
    <div class="strip">
      <div class="tabs">${tabs
        .map(
          ([c, t], i) =>
            `${i === 1 ? '<div class="gl">My PRs</div>' : ''}<div class="tab ${c}"><i class="fav"></i><span>${t}</span></div>`,
        )
        .join('')}
      </div>
      <div class="omni"><div class="url">github.com/acme/storefront/pull/482</div>
        <div class="ext"><img src="/icons/32.png" alt=""></div></div>
    </div>
    <div class="copy"><h1>Every pull request you opened, in one tab group.</h1>
      <p>Merged or closed PRs leave on their own. New ones show up as background tabs.</p></div>`;
        const card = Object.assign(document.createElement('div'), { className: 'card' });
        Object.assign(card.style, {
          right: '96px',
          top: '104px',
          transform: 'scale(1.3)',
          transformOrigin: 'top right',
        });
        frame('popup.html', 380, 468, (d) => {
          d.getElementById('hidden-wrap').open = true;
        }).then((f) => card.append(f));
        stage.append(card);
      } else if (shot === 'options') {
        stage.className = 'stage';
        stage.innerHTML = `<div class="copy" style="top:310px;width:420px"><h1>Your token stays in your browser.</h1>
    <p>No tracking, no analytics, no server of our own. The token is sent only to GitHub, and the code is open source.</p></div>`;
        const card = Object.assign(document.createElement('div'), { className: 'card' });
        Object.assign(card.style, { right: '72px', top: '48px' });
        frame('options.html', 660, 704, (d) => d.scrollingElement.scrollTo(0, 0)).then((f) => card.append(f));
        stage.append(card);
      } else {
        stage.className = 'tile';
        stage.innerHTML = `<img src="/icons/128.png" alt=""><h1>My PRs Tab Group</h1>
    <p>Your open GitHub PRs, one tab group away.</p>`;
      }
    </script>
  </body>
</html>
