<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My PRs</title>
  </head>
  <body>
    <header class="bar">
      <button class="chip" id="chip" title="Go to the tab group">
        <span id="chip-title">My PRs</span>
        <span class="chip-count" id="chip-count">0</span>
      </button>
      <div class="actions">
        <button class="icon-btn" id="sync" title="Sync now" aria-label="Sync now">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 2.5a5.5 5.5 0 0 1 4.9 3H11v1.5h4.25V2.75H13.75v1.6A7 7 0 0 0 1 8h1.5A5.5 5.5 0 0 1 8 2.5Zm5.5 5.5A5.5 5.5 0 0 1 3.1 10.5H5V9H.75v4.25h1.5v-1.6A7 7 0 0 0 15 8h-1.5Z"
            />
          </svg>
        </button>
        <button class="icon-btn" id="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6.9.5h2.2l.4 2a5.6 5.6 0 0 1 1.3.75l1.93-.65 1.1 1.9-1.53 1.35a5.7 5.7 0 0 1 0 1.5l1.53 1.35-1.1 1.9-1.93-.65a5.6 5.6 0 0 1-1.3.75l-.4 2H6.9l-.4-2a5.6 5.6 0 0 1-1.3-.75l-1.93.65-1.1-1.9L3.7 7.35a5.7 5.7 0 0 1 0-1.5L2.17 4.5l1.1-1.9 1.93.65A5.6 5.6 0 0 1 6.5 2.5l.4-2ZM8 5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"
              transform="translate(0 1)"
            />
          </svg>
        </button>
      </div>
    </header>

    <p class="status" id="status" role="status"></p>
    <main id="list"></main>

    <details class="hidden-wrap" id="hidden-wrap" hidden>
      <summary>Hidden <span class="muted" id="hidden-count"></span></summary>
      <div id="hidden-list"></div>
    </details>

    <footer class="foot">
      <label class="toggle">
        <input type="checkbox" id="enabled" />
        <span>Keep the group in sync</span>
      </label>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
